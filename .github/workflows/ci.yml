name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # tests/ci.sh fails when shellcheck or jq is missing; install both
      # rather than rely on what the runner image happens to ship.
      - name: Install shellcheck and jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: ShellCheck, tests, and secret-file check
        run: tests/ci.sh
