# Sample omarchy-vpn-picker profile.
# Copy to ~/.config/vpn-picker/profiles/<name>.conf and edit. The file name
# (without .conf) is the profile id; NAME is what the menu shows.
# Format: KEY=value, one per line. The file is parsed, never executed.

NAME="Example VPN"

# --- What to connect -----------------------------------------------------------
# OpenVPN config file. A relative path is looked up in VPN_DIR (default ~/vpn).
CONFIG="example.ovpn"

# Or a NetworkManager VPN connection instead of CONFIG:
#CONNECTION="Example VPN"
# TYPE is inferred (openvpn when CONFIG is set, nm when CONNECTION is set).
#TYPE=openvpn

# --- Credentials (all optional) --------------------------------------------------
# Leave these out and OpenVPN or NetworkManager asks on its own.
#
# Each *_OP value is a 1Password secret reference read with `op read`.
# Copy one from 1Password: open the item, click the field's arrow, choose
# "Copy Secret Reference". If op is missing or not signed in, the picker
# asks for the value in the terminal instead.

# Username: a fixed value or a 1Password reference (OpenVPN only;
# NetworkManager keeps the username in the connection).
USERNAME="your-username"
#USERNAME_OP="op://Private/Example VPN/username"

# Password and one-time password sources.
#PASSWORD_OP="op://Private/Example VPN/password"
OTP_OP="op://Private/Example VPN/one-time password?attrtype=otp"

# What to send as the password:
#   none          send nothing; OpenVPN prompts by itself
#   password      the password (PASSWORD_OP, or asked)
#   otp           the one-time password only (OTP_OP, or asked)
#   password+otp  password, OTP_SEPARATOR, then the one-time password
# Inferred when unset: both PASSWORD_OP and OTP_OP -> password+otp,
# OTP_OP -> otp, PASSWORD_OP or a username -> password, otherwise none.
#PASSWORD_MODE=otp
#OTP_SEPARATOR=""

# --- Extras ------------------------------------------------------------------------
# 1Password account for this profile (overrides OP_ACCOUNT in the config).
#OP_ACCOUNT=my.1password.com
# Extra OpenVPN arguments, split on spaces.
#OPENVPN_ARGS=--auth-nocache
# NetworkManager secret the password goes into (NM connections only).
#NM_SECRET_KEY=vpn.secrets.password
